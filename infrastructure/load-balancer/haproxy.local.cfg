# Local-only two-replica Metriqen serving experiment.
# NOT public TLS ingress or a production authentication/security boundary.
# The two gateways must each bind to 127.0.0.1 and share one local Ollama.
global
    maxconn 256

defaults
    mode http
    timeout connect 3s
    timeout client 180s
    timeout server 180s
    timeout http-request 8s
    timeout http-keep-alive 30s

frontend metriqen_local_chat
    bind 127.0.0.1:8090
    acl chat_endpoint path -i /v1/chat/completions
    acl chat_method method POST
    http-request deny deny_status 404 unless chat_endpoint chat_method
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    default_backend metriqen_local_gateways

backend metriqen_local_gateways
    balance leastconn
    option httpchk GET /health/upstream
    http-check expect status 200
    server gateway_one 127.0.0.1:8081 check inter 5s fall 2 rise 2
    server gateway_two 127.0.0.1:8082 check inter 5s fall 2 rise 2
