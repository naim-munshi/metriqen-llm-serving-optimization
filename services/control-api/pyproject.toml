[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "metriqen-control-api"
version = "0.1.0"
description = "Control plane foundation for Metriqen"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.10,<3",
    "SQLAlchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["model_console/*.html", "model_console/*.css", "model_console/*.js", "account_console/*.html", "account_console/*.css", "account_console/*.js"]
