name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        working-directory: services/control-api
        run: python -m pytest -q

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check formatting
        working-directory: services/inference-gateway
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Run race-enabled Go tests
        working-directory: services/inference-gateway
        run: go test -race ./...
      - name: Go vet
        working-directory: services/inference-gateway
        run: go vet ./...

  local-benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run offline benchmark contract tests
        run: python -m unittest discover -s tools/benchmark/tests -v
      - name: Check Python syntax
        run: python -m compileall -q tools

  local-inference-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Exercise Go gateway through benchmark CLI
        run: python -m unittest discover -s tests/e2e -v

  nlp-evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify deterministic NLP evaluation
        run: python -m unittest discover -s tools/nlp_eval/tests -v
      - name: Python syntax verification
        run: python -m compileall -q tools/nlp_eval
