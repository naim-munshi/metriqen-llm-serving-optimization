name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Feature branch commits are verified via their pull request; main is verified
# on each merge. Avoid duplicate push + PR runs for the same proposed change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-repository-file-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test tracked-file guard with synthetic filenames
        run: python -m unittest discover -s tools/security/tests -v
      - name: Block force-tracked private artifact and credential-file paths
        run: python -m tools.security.repo_publication_guard

  control-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        working-directory: services/control-api
        run: python -m pytest -q

  postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: metriqen_test
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: metriqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metriqen_test -d metriqen_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Exercise checked-in SQL migration against ephemeral PostgreSQL 16
        working-directory: services/control-api
        env:
          METRIQEN_POSTGRES_CI: "1"
          METRIQEN_TEST_POSTGRES_URL: "postgresql+psycopg://metriqen_test:ci-only-synthetic-password@127.0.0.1:5432/metriqen_ci"
        run: python -m pytest -q tests/test_postgres_integration.py

  team-postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: metriqen_test
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: metriqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metriqen_test -d metriqen_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Verify isolated team invitation migration and audit on PostgreSQL 16
        working-directory: services/control-api
        env:
          METRIQEN_POSTGRES_CI: "1"
          METRIQEN_TEST_POSTGRES_URL: "postgresql+psycopg://metriqen_test:ci-only-synthetic-password@127.0.0.1:5432/metriqen_ci"
        run: python -m pytest -q tests/test_team_postgres_ci.py

  durable-deployments-postgres-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: metriqen_test
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: metriqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metriqen_test -d metriqen_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Verify durable deployment migration, replay and CAS race on PostgreSQL 16
        working-directory: services/control-api
        env:
          METRIQEN_POSTGRES_CI: "1"
          METRIQEN_TEST_POSTGRES_URL: "postgresql+psycopg://metriqen_test:ci-only-synthetic-password@127.0.0.1:5432/metriqen_ci"
        run: python -m pytest -q tests/test_durable_deployments_postgres_ci.py

  redis-project-quota-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Verify shared Redis 7 quota/inflight leases, ACL and crash recovery
        working-directory: services/control-api
        env:
          METRIQEN_REDIS_CI: "1"
        run: python -m pytest -q tests/test_project_quota_redis_ci.py tests/test_project_inflight_redis_ci.py tests/test_browser_session_redis_ci.py

  local-load-balancer-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install HAProxy for syntax verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends haproxy
      - name: Verify loopback HAProxy configuration
        run: haproxy -c -f infrastructure/load-balancer/haproxy.local.cfg

  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check formatting
        working-directory: services/inference-gateway
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Go source files require gofmt:"
            echo "$unformatted"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi
      - name: Exercise local portfolio Makefile format-check target
        run: make format-check
      - name: Run race-enabled Go tests
        working-directory: services/inference-gateway
        run: go test -race -v -timeout 90s ./...
      - name: Go vet
        working-directory: services/inference-gateway
        run: go vet ./...

  gateway-model-selection-microbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Record Go runtime and isolated CPU benchmark methodology
        working-directory: services/inference-gateway
        run: |
          go version
          echo "Synthetic CPU-only path: baseline double JSON decode vs optimized single-pass model selection"
          echo "The numbers do not measure model inference, GPU throughput, TTFT, or real p95 latency."
      - name: Run paired Go allocation and CPU microbenchmarks (no unstable speedup assertion)
        working-directory: services/inference-gateway
        env:
          GOMAXPROCS: "1"
        run: go test -run '^$' -bench '^BenchmarkModelSelection$' -benchtime=250ms -count=5 -benchmem -cpu 1 ./internal/httpapi

  local-benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run offline benchmark contract tests
        run: python -m unittest discover -s tools/benchmark/tests -v
      - name: Check Python syntax
        run: python -W error::SyntaxWarning -m compileall -q -f tools

  local-inference-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
          cache: false
      - name: Exercise Go gateway through benchmark CLI
        run: python -m unittest discover -s tests/e2e -v
      - name: Exercise actual read-only browser dashboard JavaScript
        run: |
          node --version
          node --test tests/ui/*.test.cjs

  p4-synthetic-chromium-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned isolated browser QA dependency
        run: npm install --no-save --no-package-lock --prefix tests/ui/headless playwright@1.56.1
      - name: Install pinned Chromium runtime for headless QA
        run: tests/ui/headless/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real embedded Operations UI at 320, 390, 768, 1440px
        run: node tests/ui/headless/responsive_browser_check.cjs
      - name: Exercise local Model Manager and Account Console at 320 and 390px
        run: node tests/ui/headless/three_consoles_check.cjs
      # Synthetic fixture only: no real Mac, Ollama, browser account,
      # customer data or screenshots are read/published by this job.

  nlp-evaluation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify deterministic NLP evaluation
        run: python -m unittest discover -s tools/nlp_eval/tests -v
      - name: Python syntax verification
        run: python -m compileall -q tools/nlp_eval
