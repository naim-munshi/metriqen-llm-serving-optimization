name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Feature branch commits are verified via their pull request; main is verified
# on each merge. Avoid duplicate push + PR runs for the same proposed change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        working-directory: services/control-api
        run: python -m pytest -q

  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check formatting
        working-directory: services/inference-gateway
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Run race-enabled Go tests
        working-directory: services/inference-gateway
        run: go test -race -v -timeout 90s ./...
      - name: Go vet
        working-directory: services/inference-gateway
        run: go vet ./...

  local-benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run offline benchmark contract tests
        run: python -m unittest discover -s tools/benchmark/tests -v
      - name: Check Python syntax
        run: python -W error::SyntaxWarning -m compileall -q -f tools

  local-inference-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Exercise Go gateway through benchmark CLI
        run: python -m unittest discover -s tests/e2e -v

  nlp-evaluation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify deterministic NLP evaluation
        run: python -m unittest discover -s tools/nlp_eval/tests -v
      - name: Python syntax verification
        run: python -m compileall -q tools/nlp_eval
