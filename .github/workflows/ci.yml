name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        working-directory: services/control-api
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        working-directory: services/control-api
        run: python -m pytest -q

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check formatting
        working-directory: services/inference-gateway
        run: test -z "$(gofmt -l cmd/server/main.go internal/httpapi/router.go internal/httpapi/router_test.go)"
      - name: Run race-enabled Go tests
        working-directory: services/inference-gateway
        run: go test -race ./...
