# Local development only; not a production deployment specification.
services:
  control-api:
    build: ./services/control-api
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inference-gateway:
    build: ./services/inference-gateway
    environment:
      METRIQEN_GATEWAY_BIND_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
